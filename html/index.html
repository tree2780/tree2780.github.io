<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIF Homepage</title>
    <link rel="stylesheet" href="../style/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="top-nav">
        <i class="fa-solid fa-bars menu-icon"></i>
        <h1 class="logo">SIF</h1>
        <a href="settings.html" class="profile-pic">
            <img src="https://ui-avatars.com/api/?name=User&background=333&color=fff" alt="Profile">
        </a>
    </header>

    <main class="content">
        <div class="stats-scroll-container">
            <div class="stat-card">
                <p class="stat-label">Saved</p>
                <h2 class="stat-value">$7.89</h2>
                <p class="stat-subtext">+2% month over month</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Reduced Waste</p>
                <h2 class="stat-value">0.8kg</h2>
                <p class="stat-subtext">+9% month over month</p>
            </div>
        </div>

        <div class="card graph-card">
            <h3 class="card-title">Generic graph to make the homepage look less empty</h3>
            <div class="chart-container">
                <canvas id="growthChart"></canvas>
            </div>
        </div>

        <div class="card leaderboard-card">
            <h3 class="card-title">Top SIF users</h3>
            
            <div class="leaderboard-item">
                <div class="rank">#1</div>
                <img src="https://ui-avatars.com/api/?name=John+Doe&background=0D8ABC&color=fff" alt="Avatar" class="avatar">
                <div class="user-info">
                    <p class="user-name">John Doe</p>
                    <p class="user-email">sif.enjoyer@sifIsSoCool.com</p>
                </div>
            </div>

            <div class="leaderboard-item">
                <div class="rank">#2</div>
                <img src="https://ui-avatars.com/api/?name=Doe+Johnson&background=0D8ABC&color=fff" alt="Avatar" class="avatar">
                <div class="user-info">
                    <p class="user-name">Doe Johnson</p>
                    <p class="user-email">sif.enjoyer@sifIsSoCool.com</p>
                </div>
            </div>

            <div class="leaderboard-item">
                <div class="rank">#3</div>
                <img src="https://ui-avatars.com/api/?name=Joh+Do&background=0D8ABC&color=fff" alt="Avatar" class="avatar">
                <div class="user-info">
                    <p class="user-name">Joh Do</p>
                    <p class="user-email">sif.enjoyer@sifIsSoCool.com</p>
                </div>
            </div>
        </div>
    </main>

    <script src="../javascript/index.js"></script>

    <nav class="floating-dock">
        <a href="index.html" class="dock-item active">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="fridge.html" class="dock-item">
            <i class="fa-solid fa-snowflake"></i> 
        </a>
        <a href="recipe.html" class="dock-item">
            <i class="fa-solid fa-utensils"></i>
        </a>
        <a href="settings.html" class="dock-item">
            <i class="fa-solid fa-user"></i>
        </a>
    </nav>
</body>
</html>
